<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="Helvetica, Arial, sans-serif">
  <title>JTV Concierge architecture: where everything runs, and how one message becomes checked product tiles and a streamed reply</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33415c"/>
    </marker>
  </defs>
  <rect width="1240" height="910" fill="#ffffff"/>

  <rect x="30" y="40" width="1180" height="320" rx="10" fill="#f2f6fa" stroke="#b9c6d6" stroke-width="1.4"/>
  <text x="46" y="66" font-size="13" font-weight="700" fill="#33415c">Shopper's browser</text>
  <rect x="30" y="400" width="1180" height="160" rx="10" fill="#f7f7f5" stroke="#c4cbb8" stroke-width="1.4"/>
  <text x="46" y="424" font-size="13" font-weight="700" fill="#33415c">JTV website server (Node)</text>
  <rect x="30" y="600" width="1180" height="180" rx="10" fill="#f3f8f3" stroke="#aecdb0" stroke-width="1.4"/>
  <text x="46" y="624" font-size="13" font-weight="700" fill="#33415c">Algolia Agent Studio</text>

  <rect x="60" y="110" width="110" height="64" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="115" y="138" font-size="12.5" fill="#33415c" text-anchor="middle">Shopper</text>
  <text x="115" y="156" font-size="10.5" fill="#6b7a90" text-anchor="middle">types a request</text>

  <rect x="230" y="96" width="200" height="88" rx="8" fill="#ffffff" stroke="#0076a9" stroke-width="1.6"/>
  <text x="330" y="122" font-size="13" font-weight="700" fill="#33415c" text-anchor="middle">JTV page</text>
  <text x="330" y="142" font-size="11" fill="#33415c" text-anchor="middle">conversation left,</text>
  <text x="330" y="158" font-size="11" fill="#33415c" text-anchor="middle">product tiles right</text>

  <rect x="490" y="96" width="180" height="88" rx="8" fill="#ffffff" stroke="#0076a9" stroke-width="1.6"/>
  <text x="580" y="122" font-size="13" font-weight="700" fill="#33415c" text-anchor="middle">Chat client</text>
  <text x="580" y="142" font-size="11" fill="#33415c" text-anchor="middle">InstantSearch,</text>
  <text x="580" y="158" font-size="11" fill="#33415c" text-anchor="middle">runs in the page</text>

  <rect x="730" y="96" width="240" height="88" rx="8" fill="#ffffff" stroke="#0076a9" stroke-width="1.6"/>
  <text x="850" y="122" font-size="13" font-weight="700" fill="#33415c" text-anchor="middle">Tiles and chips</text>
  <text x="850" y="142" font-size="11" fill="#33415c" text-anchor="middle">tiles from the search results,</text>
  <text x="850" y="158" font-size="11" fill="#33415c" text-anchor="middle">chips narrow the next search</text>

  <path d="M 230 246 h 190 v 66 a 95 8 0 0 1 -190 0 z" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <ellipse cx="325" cy="246" rx="95" ry="8" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <text x="325" y="278" font-size="12" fill="#33415c" text-anchor="middle">Session state</text>
  <text x="325" y="296" font-size="10.5" fill="#6b7a90" text-anchor="middle">shopping facts and chip picks, per tab</text>

  <rect x="560" y="240" width="300" height="88" rx="8" fill="#f8faf5" stroke="#2e7d4f" stroke-width="1.6"/>
  <text x="710" y="264" font-size="12.5" font-weight="700" fill="#33415c" text-anchor="middle">Display staging (in the browser)</text>
  <text x="710" y="284" font-size="11" fill="#33415c" text-anchor="middle">tiles and chips from the streamed search</text>
  <text x="710" y="302" font-size="10.5" fill="#6b7a90" text-anchor="middle">variant dedupe, stock and image checks</text>

  <polyline points="170,142 230,142" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="430,140 490,140" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="460" y="130" font-size="10.5" fill="#33415c" text-anchor="middle">message</text>
  <polyline points="670,140 730,140" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="700" y="130" font-size="10.5" fill="#33415c" text-anchor="middle">streamed reply</text>
  <polyline points="300,184 300,240" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="312" y="218" font-size="10.5" fill="#33415c" text-anchor="start">kept while the tab lives</text>
  <polyline points="620,184 620,240" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="632" y="218" font-size="10.5" fill="#33415c" text-anchor="start">stages the display here</text>

  <polyline points="490,160 430,160 430,480 450,480" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="418" y="310" font-size="10.5" fill="#33415c" text-anchor="end">the message</text>
  <polyline points="530,440 530,184" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="542" y="310" font-size="10.5" fill="#33415c" text-anchor="start">the reply, streamed</text>

  <rect x="450" y="440" width="160" height="80" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="530" y="466" font-size="12.5" fill="#33415c" text-anchor="middle">Chat API</text>
  <text x="530" y="484" font-size="10.5" fill="#6b7a90" text-anchor="middle">/api/chat</text>
  <text x="530" y="500" font-size="10.5" fill="#6b7a90" text-anchor="middle">forwards to the agent</text>

  <polygon points="660,480 750,436 840,480 750,524" fill="#fff8ef" stroke="#33415c" stroke-width="1.4"/>
  <text x="750" y="470" font-size="12" fill="#33415c" text-anchor="middle">Tool check</text>
  <text x="750" y="488" font-size="10.5" fill="#6b7a90" text-anchor="middle">the agent may only offer</text>
  <text x="750" y="502" font-size="10.5" fill="#6b7a90" text-anchor="middle">tools this build can run</text>

  <rect x="880" y="440" width="200" height="80" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="980" y="470" font-size="12.5" fill="#33415c" text-anchor="middle">Read-only APIs</text>
  <text x="980" y="490" font-size="11" fill="#33415c" text-anchor="middle">product lookups, search, refresh</text>
  <text x="980" y="508" font-size="10.5" fill="#6b7a90" text-anchor="middle">the key can read, never write</text>

  <polyline points="610,480 660,480" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="820,328 820,380 980,380 980,440" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="906" y="372" font-size="10.5" fill="#33415c" text-anchor="middle">exact-product refresh, read-only</text>

  <rect x="60" y="628" width="240" height="88" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="180" y="654" font-size="12.5" font-weight="700" fill="#33415c" text-anchor="middle">Output guardrail</text>
  <text x="180" y="674" font-size="11" fill="#33415c" text-anchor="middle">reviews every reply against five rules,</text>
  <text x="180" y="690" font-size="11" fill="#33415c" text-anchor="middle">can withhold the text</text>

  <rect x="400" y="620" width="240" height="96" rx="8" fill="#ffffff" stroke="#0076a9" stroke-width="1.6"/>
  <text x="520" y="648" font-size="13" font-weight="700" fill="#33415c" text-anchor="middle">Concierge agent</text>
  <text x="520" y="668" font-size="11" fill="#33415c" text-anchor="middle">one definition, in Agent Studio;</text>
  <text x="520" y="684" font-size="11" fill="#33415c" text-anchor="middle">test copy and live copy identical</text>
  <text x="520" y="702" font-size="10.5" fill="#6b7a90" text-anchor="middle">writes every word the shopper reads</text>

  <rect x="690" y="636" width="150" height="64" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="765" y="662" font-size="12" fill="#33415c" text-anchor="middle">Catalogue search</text>
  <text x="765" y="680" font-size="10.5" fill="#6b7a90" text-anchor="middle">the agent's own tool</text>

  <path d="M 880 634 h 200 v 70 a 100 8 0 0 1 -200 0 z" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <ellipse cx="980" cy="634" rx="100" ry="8" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <text x="980" y="664" font-size="12" fill="#33415c" text-anchor="middle">JTV catalogue</text>
  <text x="980" y="682" font-size="10.5" fill="#6b7a90" text-anchor="middle">products, blog, help articles</text>
  <text x="980" y="698" font-size="10.5" fill="#6b7a90" text-anchor="middle">read-only to this system</text>

  <polyline points="400,668 300,668" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="350" y="658" font-size="10.5" fill="#33415c" text-anchor="middle">writes every word</text>
  <polyline points="640,668 690,668" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="665" y="654" font-size="10.5" fill="#33415c" text-anchor="middle">searches</text>
  <polyline points="840,656 880,656" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="880,692 840,692" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="860" y="710" font-size="10.5" fill="#33415c" text-anchor="middle">results</text>
  <polyline points="980,520 980,628" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="992" y="580" font-size="10.5" fill="#33415c" text-anchor="start">reads the same catalogue</text>

  <polyline points="750,524 750,570 520,570 520,620" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="180,628 180,530 530,530 530,520" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="355" y="522" font-size="10.5" fill="#33415c" text-anchor="middle">approved reply</text>
  <polyline points="840,470 868,470 868,76 650,76 650,96" fill="none" stroke="#33415c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="760" y="68" font-size="10.5" fill="#33415c" text-anchor="middle">mismatch: the page shows a clear error</text>
  <polyline points="60,672 38,672 38,215 280,215 280,184" fill="none" stroke="#33415c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="44" y="207" font-size="10.5" fill="#33415c" text-anchor="start">withheld: a fixed notice; the checked tiles stay</text>

  <text x="60" y="806" font-size="13" font-weight="700" fill="#33415c">How a change reaches production</text>
  <rect x="60" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="165" y="845" font-size="11" fill="#33415c" text-anchor="middle">Change and test locally:</text>
  <text x="165" y="861" font-size="11" fill="#33415c" text-anchor="middle">npm run dev + dev agent</text>
  <rect x="300" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="405" y="845" font-size="11" fill="#33415c" text-anchor="middle">Merge to main: pull request,</text>
  <text x="405" y="861" font-size="11" fill="#33415c" text-anchor="middle">CI green</text>
  <rect x="540" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="645" y="845" font-size="11" fill="#33415c" text-anchor="middle">Promote: scripts/baseline,</text>
  <text x="645" y="861" font-size="11" fill="#33415c" text-anchor="middle">agent then app</text>
  <rect x="780" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="885" y="845" font-size="11" fill="#33415c" text-anchor="middle">Production: Vercel app</text>
  <text x="885" y="861" font-size="11" fill="#33415c" text-anchor="middle">+ production agent</text>
  <rect x="1020" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="1125" y="853" font-size="11" fill="#33415c" text-anchor="middle">verify-baseline.mjs</text>
  <polyline points="270,850 300,850" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="510,850 540,850" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="750,850 780,850" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="990,850 1020,850" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>
