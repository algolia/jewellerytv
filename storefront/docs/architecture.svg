<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="Helvetica, Arial, sans-serif">
  <title>JTV Concierge workflow: one chat pipe, tools executed in the browser, guards on both ends, and the baseline release path</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33415c"/>
    </marker>
  </defs>
  <rect width="1240" height="910" fill="#ffffff"/>

  <!-- boundary bands -->
  <rect x="30" y="40" width="1180" height="300" rx="10" fill="#f2f6fa" stroke="#b9c6d6" stroke-width="1.4"/>
  <text x="46" y="66" font-size="13" font-weight="700" fill="#33415c">Shopper's browser</text>
  <rect x="30" y="380" width="1180" height="168" rx="10" fill="#f7f7f5" stroke="#c4cbb8" stroke-width="1.4"/>
  <text x="46" y="404" font-size="13" font-weight="700" fill="#33415c">JTV website server (Node)</text>
  <rect x="30" y="580" width="1180" height="180" rx="10" fill="#f3f8f3" stroke="#aecdb0" stroke-width="1.4"/>
  <text x="46" y="604" font-size="13" font-weight="700" fill="#33415c">Algolia Agent Studio</text>

  <!-- browser row 1 -->
  <rect x="60" y="90" width="90" height="72" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="105" y="122" font-size="12.5" fill="#33415c" text-anchor="middle">Shopper</text>
  <text x="105" y="140" font-size="10.5" fill="#6b7a90" text-anchor="middle">sees the page</text>

  <rect x="190" y="90" width="170" height="72" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="275" y="118" font-size="12.5" fill="#33415c" text-anchor="middle">Two-column</text>
  <text x="275" y="134" font-size="12.5" fill="#33415c" text-anchor="middle">JTV workspace</text>
  <text x="275" y="152" font-size="10.5" fill="#6b7a90" text-anchor="middle">conversation + tiles</text>

  <rect x="400" y="90" width="150" height="72" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="475" y="118" font-size="12.5" fill="#33415c" text-anchor="middle">InstantSearch</text>
  <text x="475" y="134" font-size="12.5" fill="#33415c" text-anchor="middle">chat client</text>
  <text x="475" y="152" font-size="10.5" fill="#6b7a90" text-anchor="middle">useChat</text>

  <rect x="600" y="90" width="230" height="72" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="715" y="112" font-size="12.5" fill="#33415c" text-anchor="middle">Client tool executors</text>
  <text x="715" y="130" font-size="11" fill="#33415c" text-anchor="middle">refresh_products, arrange_groups</text>
  <text x="715" y="148" font-size="10.5" fill="#6b7a90" text-anchor="middle">run in the browser</text>

  <rect x="870" y="90" width="270" height="72" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="1005" y="112" font-size="12.5" fill="#33415c" text-anchor="middle">Workspace tiles</text>
  <text x="1005" y="130" font-size="11" fill="#33415c" text-anchor="middle">one column per group, from</text>
  <text x="1005" y="146" font-size="11" fill="#33415c" text-anchor="middle">verified tool results in the stream</text>

  <!-- browser row 2 -->
  <rect x="190" y="220" width="170" height="48" rx="24" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <text x="275" y="240" font-size="11.5" fill="#33415c" text-anchor="middle">Per-tab</text>
  <text x="275" y="256" font-size="11.5" fill="#33415c" text-anchor="middle">session state</text>

  <!-- browser edges -->
  <polyline points="150,126 190,126" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="360,112 400,112" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="380" y="104" font-size="10.5" fill="#33415c" text-anchor="middle">sends</text>
  <polyline points="400,146 360,146" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="380" y="164" font-size="10.5" fill="#33415c" text-anchor="middle">streams</text>
  <polyline points="275,90 275,64 1005,64 1005,90" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="620" y="56" font-size="10.5" fill="#33415c" text-anchor="middle">builds the tiles from verified tool results in the stream</text>
  <polyline points="550,112 600,112" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="575" y="104" font-size="10.5" fill="#33415c" text-anchor="middle">tool calls</text>
  <polyline points="600,146 550,146" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="575" y="164" font-size="10.5" fill="#33415c" text-anchor="middle">results return</text>
  <polyline points="350,162 350,220" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- chat transport down and up -->
  <polyline points="455,162 455,424" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="445" y="300" font-size="10.5" fill="#33415c" text-anchor="middle" transform="rotate(-90 445 300)">POST /api/chat</text>
  <polyline points="495,424 495,162" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="509" y="300" font-size="10.5" fill="#33415c" text-anchor="middle" transform="rotate(90 509 300)">reply streams back</text>

  <!-- server band -->
  <rect x="400" y="424" width="150" height="48" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="475" y="444" font-size="12" fill="#33415c" text-anchor="middle">/api/chat</text>
  <text x="475" y="461" font-size="12" fill="#33415c" text-anchor="middle">proxy</text>

  <polygon points="640,448 740,408 840,448 740,488" fill="#fff8ef" stroke="#33415c" stroke-width="1.4"/>
  <text x="740" y="440" font-size="12" fill="#33415c" text-anchor="middle">Tool-sheet guard:</text>
  <text x="740" y="457" font-size="10.5" fill="#6b7a90" text-anchor="middle">declared tools vs</text>
  <text x="740" y="471" font-size="10.5" fill="#6b7a90" text-anchor="middle">tools this build answers</text>

  <rect x="920" y="424" width="250" height="48" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="1045" y="443" font-size="11" fill="#33415c" text-anchor="middle">Read-only APIs: /api/products/:id,</text>
  <text x="1045" y="459" font-size="11" fill="#33415c" text-anchor="middle">/api/agent-product-refresh, /api/search, /api/facets</text>

  <path d="M 950 496 h 190 v 30 a 95 8 0 0 1 -190 0 z" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <ellipse cx="1045" cy="496" rx="95" ry="8" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <text x="1045" y="521" font-size="11" fill="#33415c" text-anchor="middle">prod_catalog, read-only</text>

  <!-- server edges -->
  <polyline points="550,448 640,448" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="790,162 790,424" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="800" y="300" font-size="10.5" fill="#33415c" text-anchor="middle" transform="rotate(-90 800 300)">read-only record lookups</text>
  <polyline points="1045,472 1045,488" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="840,426 862,360 862,190 550,190" fill="none" stroke="#33415c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="690" y="181" font-size="10.5" fill="#33415c" text-anchor="middle">mismatch: labelled 503 tool_sheet_mismatch</text>

  <!-- studio band -->
  <rect x="400" y="620" width="230" height="72" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="515" y="648" font-size="12.5" fill="#33415c" text-anchor="middle">Concierge agent</text>
  <text x="515" y="666" font-size="10.5" fill="#6b7a90" text-anchor="middle">dev or production, one definition</text>
  <text x="515" y="682" font-size="10.5" fill="#6b7a90" text-anchor="middle">instructions + tool sheet + guardrail</text>

  <rect x="700" y="628" width="160" height="56" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="780" y="652" font-size="12" fill="#33415c" text-anchor="middle">algolia_search_index</text>
  <text x="780" y="670" font-size="10.5" fill="#6b7a90" text-anchor="middle">native tool</text>

  <path d="M 910 636 h 250 v 42 a 125 8 0 0 1 -250 0 z" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <ellipse cx="1035" cy="636" rx="125" ry="8" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <text x="1035" y="662" font-size="11" fill="#33415c" text-anchor="middle">prod_catalog, blog, help_content</text>
  <text x="1035" y="674" font-size="10.5" fill="#6b7a90" text-anchor="middle">read-only to this system</text>

  <rect x="60" y="620" width="260" height="72" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="190" y="648" font-size="12.5" fill="#33415c" text-anchor="middle">Output guardrail</text>
  <text x="190" y="666" font-size="10.5" fill="#6b7a90" text-anchor="middle">five categories on the finished reply,</text>
  <text x="190" y="682" font-size="10.5" fill="#6b7a90" text-anchor="middle">configured on the agent</text>

  <!-- studio edges -->
  <polyline points="740,488 740,565 515,565 515,620" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="640" y="556" font-size="10.5" fill="#33415c" text-anchor="middle">match</text>
  <polyline points="630,644 700,644" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="860,644 910,644" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="885" y="636" font-size="10.5" fill="#33415c" text-anchor="middle">queries</text>
  <polyline points="1035,628 1035,598 585,598 585,620" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="800" y="590" font-size="10.5" fill="#33415c" text-anchor="middle">returns matches</text>
  <polyline points="400,656 320,656" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="360" y="648" font-size="10.5" fill="#33415c" text-anchor="middle">writes</text>
  <polyline points="175,620 175,290 410,290 410,162" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="292" y="306" font-size="10.5" fill="#33415c" text-anchor="middle">approved reply streams back</text>
  <polyline points="60,656 42,656 42,190 250,190 250,162" fill="none" stroke="#33415c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="60" y="212" font-size="10.5" fill="#33415c" text-anchor="start">withheld: fixed system</text>
  <text x="60" y="226" font-size="10.5" fill="#33415c" text-anchor="start">notice beside kept tiles</text>

  <!-- release strip -->
  <text x="60" y="806" font-size="13" font-weight="700" fill="#33415c">How a change reaches production</text>
  <rect x="60" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="165" y="845" font-size="11" fill="#33415c" text-anchor="middle">Change and test locally:</text>
  <text x="165" y="861" font-size="11" fill="#33415c" text-anchor="middle">npm run dev + dev agent</text>
  <rect x="300" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="405" y="845" font-size="11" fill="#33415c" text-anchor="middle">Merge to main: pull request,</text>
  <text x="405" y="861" font-size="11" fill="#33415c" text-anchor="middle">CI green</text>
  <rect x="540" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="645" y="845" font-size="11" fill="#33415c" text-anchor="middle">Promote: scripts/baseline,</text>
  <text x="645" y="861" font-size="11" fill="#33415c" text-anchor="middle">agent then app</text>
  <rect x="780" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="885" y="845" font-size="11" fill="#33415c" text-anchor="middle">Production: Vercel app</text>
  <text x="885" y="861" font-size="11" fill="#33415c" text-anchor="middle">+ production agent</text>
  <rect x="1020" y="820" width="210" height="60" rx="8" fill="#ffffff" stroke="#33415c" stroke-width="1.4"/>
  <text x="1125" y="853" font-size="11" fill="#33415c" text-anchor="middle">verify-baseline.mjs</text>
  <polyline points="270,850 300,850" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="510,850 540,850" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="750,850 780,850" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="990,850 1020,850" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>
