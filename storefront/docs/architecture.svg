<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520" font-family="Helvetica, Arial, sans-serif">
  <title>JTV Concierge at a glance: one page, one agent, two browser checks, a read-only catalogue</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33415c"/>
    </marker>
  </defs>
  <rect width="1060" height="520" fill="#ffffff"/>

  <rect x="60" y="230" width="110" height="64" rx="8" fill="#f2f6fa" stroke="#33415c" stroke-width="1.4"/>
  <text x="115" y="258" font-size="13" fill="#33415c" text-anchor="middle">Shopper</text>
  <text x="115" y="276" font-size="10.5" fill="#6b7a90" text-anchor="middle">types a request</text>

  <rect x="230" y="200" width="260" height="124" rx="10" fill="#ffffff" stroke="#0076a9" stroke-width="1.6"/>
  <text x="360" y="230" font-size="13.5" font-weight="700" fill="#33415c" text-anchor="middle">JTV page</text>
  <text x="360" y="252" font-size="11.5" fill="#33415c" text-anchor="middle">chat on the left,</text>
  <text x="360" y="268" font-size="11.5" fill="#33415c" text-anchor="middle">product tiles on the right</text>
  <text x="360" y="292" font-size="10.5" fill="#6b7a90" text-anchor="middle">shows the reply as it is written</text>

  <rect x="580" y="200" width="240" height="124" rx="10" fill="#ffffff" stroke="#0076a9" stroke-width="1.6"/>
  <text x="700" y="230" font-size="13.5" font-weight="700" fill="#33415c" text-anchor="middle">Concierge agent</text>
  <text x="700" y="252" font-size="11.5" fill="#33415c" text-anchor="middle">one agent in Algolia Agent Studio;</text>
  <text x="700" y="268" font-size="11.5" fill="#33415c" text-anchor="middle">test copy and live copy are identical</text>
  <text x="700" y="292" font-size="10.5" fill="#6b7a90" text-anchor="middle">writes every word the shopper reads</text>

  <path d="M 880 216 h 120 v 74 a 60 8 0 0 1 -120 0 z" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <ellipse cx="940" cy="216" rx="60" ry="8" fill="#eef2f7" stroke="#33415c" stroke-width="1.4"/>
  <text x="940" y="248" font-size="11.5" fill="#33415c" text-anchor="middle">JTV catalogue</text>
  <text x="940" y="266" font-size="10.5" fill="#6b7a90" text-anchor="middle">read-only</text>

  <rect x="500" y="370" width="280" height="80" rx="10" fill="#f8faf5" stroke="#2e7d4f" stroke-width="1.6"/>
  <text x="640" y="398" font-size="12" font-weight="700" fill="#33415c" text-anchor="middle">Before tiles show, the browser checks</text>
  <text x="640" y="418" font-size="11.5" fill="#33415c" text-anchor="middle">in stock, price fits, groups fill</text>
  <text x="640" y="436" font-size="10.5" fill="#6b7a90" text-anchor="middle">checked in code, not trusted from the agent</text>

  <polyline points="170,262 230,262" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="490,240 580,240" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="535" y="231" font-size="10.5" fill="#33415c" text-anchor="middle">message</text>
  <polyline points="820,250 880,250" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="850" y="241" font-size="10.5" fill="#33415c" text-anchor="middle">searches</text>
  <polyline points="700,324 700,370" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="712" y="352" font-size="10.5" fill="#33415c" text-anchor="start">proposes pieces</text>
  <polyline points="500,410 455,410 455,324" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="447" y="372" font-size="10.5" fill="#33415c" text-anchor="end">only valid pieces become tiles</text>
  <polyline points="585,324 585,345 420,345 420,488 300,488 300,324" fill="none" stroke="#33415c" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="502" y="337" font-size="10.5" fill="#33415c" text-anchor="middle">reply streams back</text>

  <text x="60" y="508" font-size="11" fill="#6b7a90">Two safety checks run on every turn: the website confirms the agent only offers tools the page can run, and Agent Studio's guardrail reviews the reply before it stays on screen.</text>
</svg>
