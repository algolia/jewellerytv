<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 430" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>JTV Concierge architecture: components and data flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#45454d"/>
    </marker>
  </defs>
  <style>
    .b { fill: #ffffff; stroke: #c9c9d4; stroke-width: 1.2; }
    .ba { fill: #eef2ff; stroke: #0067F7; stroke-width: 1.4; }
    .bg { fill: #f7f8fa; stroke: #0067F7; stroke-width: 1.6; }
    .bd { fill: #ffffff; stroke: #c9c9d4; stroke-width: 1.2; stroke-dasharray: 5 4; }
    text { fill: #1a1a1e; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 11px; fill: #707078; }
    .l { font-size: 12.5px; }
    .n { font-size: 12.5px; font-weight: 600; fill: #0067F7; }
    .f { stroke: #45454d; stroke-width: 1.4; marker-end: url(#a); fill: none; }
    .lab { fill: #45454d; }
  </style>
  <rect x="14" y="14" width="1122" height="402" rx="12" fill="none" stroke="#eeeff4"/>
  <text x="30" y="40" class="s">IN THE BROWSER</text>
  <rect class="ba" x="30" y="50" width="240" height="64" rx="8"/>
  <text x="150" y="76" text-anchor="middle" class="t">Concierge panel</text>
  <text x="150" y="94" text-anchor="middle" class="s">conversation + product canvas</text>
  <rect class="ba" x="30" y="150" width="240" height="64" rx="8"/>
  <text x="150" y="176" text-anchor="middle" class="t">present_products</text>
  <text x="150" y="194" text-anchor="middle" class="s">verifies every tile, in the browser</text>
  <rect class="ba" x="30" y="250" width="240" height="64" rx="8"/>
  <text x="150" y="276" text-anchor="middle" class="t">refresh_products</text>
  <text x="150" y="294" text-anchor="middle" class="s">fresh facts per exact piece</text>
  <rect class="b" x="330" y="50" width="220" height="64" rx="8"/>
  <text x="440" y="76" text-anchor="middle" class="t">App server</text>
  <text x="440" y="94" text-anchor="middle" class="s">validating proxy, search-only key</text>
  <rect class="bg" x="610" y="50" width="240" height="64" rx="8"/>
  <text x="730" y="76" text-anchor="middle" class="t">Concierge agent</text>
  <text x="730" y="94" text-anchor="middle" class="s">Agent Studio, claude-sonnet-5</text>
  <rect class="bg" x="610" y="150" width="240" height="64" rx="8"/>
  <text x="730" y="176" text-anchor="middle" class="t">Guardrail</text>
  <text x="730" y="194" text-anchor="middle" class="s">4 categories, fail-open</text>
  <rect class="bd" x="910" y="50" width="200" height="150" rx="8"/>
  <text x="1010" y="76" text-anchor="middle" class="t">Indices (read-only)</text>
  <text x="1010" y="100" text-anchor="middle" class="s">prod_catalog + newest replica</text>
  <text x="1010" y="118" text-anchor="middle" class="s">blog, help_content</text>
  <text x="1010" y="142" text-anchor="middle" class="s">in-stock pre-filter on products</text>
  <text x="1010" y="160" text-anchor="middle" class="s">verbatim facet vocabulary</text>
  <path class="f" d="M 270 82 L 324 82"/>
  <text x="278" y="74" class="l">streamed turn</text>
  <path class="f" d="M 550 82 L 604 82"/>
  <text x="558" y="74" class="l">POST /api/chat</text>
  <path class="f" d="M 850 82 L 904 82"/>
  <text x="856" y="74" class="l">one search</text>
  <path class="f" d="M 904 130 L 856 130"/>
  <text x="858" y="122" class="l">hits + facet counts</text>
  <path class="f" d="M 730 114 L 730 144"/>
  <text x="738" y="134" class="l">review</text>
  <path class="f" d="M 610 100 C 480 130 380 150 276 168"/>
  <text x="330" y="140" class="l">present_products call</text>
  <path class="f" d="M 270 182 L 324 182"/>
  <text x="276" y="174" class="l">record reads</text>
  <path class="f" d="M 270 282 L 360 282 L 360 120 L 324 120"/>
  <text x="276" y="274" class="l">exact reads</text>
  <path class="f" d="M 550 182 L 324 230"/>
  <text x="400" y="196" class="l">verified list back to the agent</text>
  <path class="f" d="M 550 100 C 500 240 400 300 276 320"/>
  <text x="380" y="300" class="l">reply + tiles + chips, streamed</text>
  <text x="30" y="372" class="l" fill="#707078">The model picks; the tool verifies; the app renders. The agent writes every shopper-facing word;</text>
  <text x="30" y="392" class="l" fill="#707078">the application enforces every fact on the screen. The indices are read-only to this system.</text>
</svg>
